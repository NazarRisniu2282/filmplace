name: Django REST Framework CI/CD (uv + Railway)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ----------------------------------------------------
  # ЕТАП 1: CI (Тестування та перевірка коду)
  # ----------------------------------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Встановлюємо uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      # Налаштовуємо Python через uv
      - name: Set up Python
        run: uv python install 3.12

      # Встановлюємо залежності
      - name: Install Dependencies
        run: uv sync --all-extras --dev

      # Перевірка лінтером Flake8
      - name: Run Linters (Flake8)
        run: |
          uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # Запуск тестів Django
      - name: Run Tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-insecure-test-key-for-ci-12345' }}
        run: |
          uv run python manage.py test

  # ----------------------------------------------------
  # ЕТАП 2: CD (Автоматичний деплой на Railway)
  # ----------------------------------------------------
  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service filmplace --detach